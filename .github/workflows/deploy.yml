# 沙盒版:发布到 GitHub Pages,version.json 里写当前提交号,交付程序靠它核实
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          echo "{\"sha\":\"$GITHUB_SHA\"}" > site/version.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: pages
        uses: actions/deploy-pages@v4
